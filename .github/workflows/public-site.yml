name: Public PAPER Site Release Gate
on:
  push:
    branches: [main]
    paths: ['web/**', 'qa/paper-balances.public.test.cjs', 'qa/paper-holds.public.test.cjs', 'docs/SITE_RELEASE.md', '.github/workflows/public-site.yml']
  workflow_dispatch:
jobs:
  public-https-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify logged-out HTTPS and exact public HTML
        env:
          SITE_URL: https://crypto-trading-platform-demo.vercel.app/
        run: node web/site-public-verify.cjs
      - name: Verify public PAPER balance API denies unauthenticated access and POST
        env:
          SITE_URL: https://crypto-trading-platform-demo.vercel.app/
        run: node qa/paper-balances.public.test.cjs
      - name: Verify public PAPER holds refuse anonymous users and writes
        env:
          SITE_URL: https://crypto-trading-platform-demo.vercel.app/
        run: node qa/paper-holds.public.test.cjs
      - name: Install Chromium (Ubuntu 26.04-compatible)
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Real public desktop/mobile paper interactions
        env:
          SITE_URL: https://crypto-trading-platform-demo.vercel.app/
        run: node web/site-browser.test.cjs
      - name: Archive PUBLIC browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-site-public-desktop-mobile
          path: artifacts/*.png
          if-no-files-found: ignore
