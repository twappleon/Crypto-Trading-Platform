name: Paper Site Smoke
on:
  push:
    paths: ['web/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/site.yml']
jobs:
  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone paper-only demo
        run: |
          node web/site-smoke.test.cjs
          node web/site-interaction.test.cjs
