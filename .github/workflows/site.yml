name: Paper Site Smoke
on:
  push:
    paths: ['README.md', 'web/**', 'docs/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['README.md', 'web/**', 'docs/**', '.github/workflows/site.yml']
jobs:
  site-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify standalone paper-only demo
        run: |
          node web/site-smoke.test.cjs
          node web/site-interaction.test.cjs
          node web/paper-status.test.cjs
          node web/paper-balances.test.cjs
          node web/paper-balance-invariants.test.cjs
          node web/paper-status-ui.test.cjs
          node web/deployment-gate.test.cjs
      - name: Install Chromium for actual browser E2E
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile Chromium, save evidence
        run: node web/site-browser.test.cjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-site-r015-desktop-mobile
          path: artifacts/*.png
          if-no-files-found: ignore

  paper-pg-read-bdd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: paper
          POSTGRES_PASSWORD: paper
          POSTGRES_DB: paper_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paper -d paper_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PostgreSQL driver in isolated site workspace
        working-directory: web
        run: npm install --no-audit --no-fund --ignore-scripts --package-lock=false
      - name: Verify two-account real PostgreSQL PAPER read isolation and failure modes
        env:
          PAPER_DATABASE_URL: postgresql://paper:paper@localhost:5432/paper_qa
          PAPER_SESSION_SECRET: ci-only-secret-never-use-in-production-0123456789
        run: node qa/paper-balances.pg.test.cjs
